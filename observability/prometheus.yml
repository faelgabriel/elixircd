global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: elixircd
    metrics_path: /metrics
    static_configs:
      - targets: ["elixircd:9568"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
