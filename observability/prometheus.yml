global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: elixircd
    metrics_path: /metrics
    static_configs:
      - targets: ["elixircd:9568"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up|loki_distributor_lines_received_total|loki_request_duration_seconds_count'
        action: keep

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        action: keep

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up|grafana_api_response_status_total'
        action: keep
